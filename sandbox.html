<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>3D preview sandbox</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1016}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:10px;bottom:8px;font:11px ui-monospace,Menlo,Consolas,monospace;color:#66708a;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
/**
 * The isolated viewer sandbox.
 * It talks to the parent (the studio) only through postMessage, and AI-generated
 * code runs nowhere else. The iframe has no allow-same-origin, so this document
 * lives on an opaque origin and cannot touch the parent's DOM, storage, or API key.
 */
const send = (msg, transfer) => parent.postMessage(msg, '*', transfer || []);
const hud = document.getElementById('hud');

// three.js comes from the CDN via the import map above. If that fails, tell the
// parent so the user sees the reason instead of an endless spinner.
let THREE, OrbitControls, GLTFExporter, RoomEnvironment;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
} catch (err) {
  const why = (err && err.message) || String(err);
  hud.textContent = 'three.js failed to load';
  send({ type: 'boot-error', message: 'Could not load three.js from the CDN.\n' + why +
    '\n\nCheck your internet connection or whether unpkg.com is blocked.' });
  throw err;
}

/* ── base scene ───────────────────────────────────── */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
} catch (err) {
  hud.textContent = 'WebGL unavailable';
  send({ type: 'boot-error', message: 'WebGL could not be initialized on this browser or device.\n' + ((err && err.message) || err) });
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const defaultBackground = new THREE.Color(0x0e1016);
scene.background = defaultBackground;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(9, 6.5, 11);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.4;
controls.maxDistance = 400;

// lights (provided by the host)
const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x2b3040, 0.65);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(8, 13, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb6ff, 0.85);
rim.position.set(-9, 5, -8);
scene.add(rim);

// shadow catcher + grid
const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

const grid = new THREE.GridHelper(40, 40, 0x39415a, 0x222838);
grid.material.transparent = true;
grid.material.opacity = 0.55;
grid.visible = true;
scene.add(grid);

/* ── state ────────────────────────────────────────── */
let current = null;      // the generated THREE.Object3D
let updateFn = null;     // update() from the generated code
let autoRotate = false;
let wireframe = false;
let updateFailed = false;
const clock = new THREE.Clock();

function disposeObject(obj) {
  obj.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      for (const k of Object.keys(m)) {
        const v = m[k];
        if (v && v.isTexture) v.dispose();
      }
      m.dispose();
    }
  });
}

function clearModel() {
  if (current) { scene.remove(current); disposeObject(current); current = null; }
  updateFn = null;
  updateFailed = false;
  scene.background = defaultBackground;
  scene.fog = null;
}

/** Fit the camera, shadow frustum, and grid to the model's size */
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty() || !isFinite(box.min.x)) return null;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() * 0.5, 0.5);

  controls.target.copy(center);
  const dir = new THREE.Vector3(1, 0.62, 1.15).normalize();
  camera.position.copy(center).addScaledVector(dir, radius * 2.6);
  camera.near = Math.max(radius / 200, 0.01);
  camera.far = radius * 200;
  camera.updateProjectionMatrix();
  controls.update();

  const d = Math.max(radius * 2.2, 6);
  key.position.copy(center).add(new THREE.Vector3(d * 0.7, d * 1.15, d * 0.6));
  key.target.position.copy(center);
  key.target.updateMatrixWorld();
  scene.add(key.target);
  const cam = key.shadow.camera;
  cam.left = -d; cam.right = d; cam.top = d; cam.bottom = -d;
  cam.near = 0.1; cam.far = d * 6;
  cam.updateProjectionMatrix();

  shadowCatcher.position.y = Math.min(box.min.y, 0);
  grid.position.y = shadowCatcher.position.y + 0.001;
  const gridSize = Math.max(Math.ceil(radius * 4), 10);
  grid.geometry.dispose();
  const ng = new THREE.GridHelper(gridSize, Math.min(gridSize, 60), 0x39415a, 0x222838);
  grid.geometry = ng.geometry;
  ng.material.dispose();

  return { size, center, radius };
}

function countStats(obj) {
  let meshes = 0, tris = 0;
  obj.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    meshes++;
    const g = o.geometry;
    const n = g.index ? g.index.count : (g.attributes.position ? g.attributes.position.count : 0);
    tris += Math.floor(n / 3) * (o.isInstancedMesh ? o.count : 1);
  });
  return { meshes, triangles: tris };
}

function applyWireframe(on) {
  if (!current) return;
  current.traverse((o) => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) if ('wireframe' in m) m.wireframe = on;
  });
}

/* ── running the AI's code ────────────────────────── */
function run(code) {
  clearModel();
  const started = performance.now();
  try {
    const factory = new Function(
      'THREE', 'ctx',
      '"use strict";\n' + code +
      '\n;return {' +
      ' createModel: typeof createModel === "function" ? createModel : null,' +
      ' update: typeof update === "function" ? update : null };'
    );
    const ctx = { scene, camera, renderer };
    const api = factory(THREE, ctx);
    if (!api || typeof api.createModel !== 'function') {
      throw new Error('No createModel(THREE, ctx) function was defined.');
    }
    const root = api.createModel(THREE, ctx);
    if (!root || !root.isObject3D) {
      throw new Error('createModel() did not return a THREE.Object3D.');
    }
    current = root;
    updateFn = typeof api.update === 'function' ? api.update : null;
    scene.add(root);

    const framed = frameObject(root) || { radius: 5 };
    applyWireframe(wireframe);

    // render one frame right away so runtime errors surface immediately
    renderer.render(scene, camera);
    if (updateFn) updateFn(current, 0, 0);

    const stats = countStats(root);
    hud.textContent = stats.meshes + ' meshes · ' + stats.triangles.toLocaleString() + ' tris';
    send({
      type: 'ok',
      stats: { ...stats, ms: Math.round(performance.now() - started), animated: !!updateFn },
    });
  } catch (err) {
    clearModel();
    hud.textContent = '';
    send({ type: 'error', message: formatError(err) });
  }
}

function formatError(err) {
  const msg = (err && (err.message || String(err))) || 'Unknown error';
  const stack = err && err.stack ? String(err.stack).split('\n').slice(0, 4).join('\n') : '';
  return stack && !stack.includes(msg) ? msg + '\n' + stack : (stack || msg);
}

/* ── render loop ──────────────────────────────────── */
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.getElapsedTime();
  if (current && autoRotate) current.rotation.y += dt * 0.35;
  if (updateFn && current && !updateFailed) {
    try { updateFn(current, t, dt); }
    catch (err) {
      updateFailed = true;
      send({ type: 'error', message: 'update() threw an error\n' + formatError(err) });
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── capture / export ─────────────────────────────── */
function snapshot({ maxWidth = 0, mime = 'image/png', quality = 0.92 } = {}) {
  renderer.render(scene, camera);
  const src = renderer.domElement;
  if (!maxWidth || src.width <= maxWidth) return src.toDataURL(mime, quality);
  const c = document.createElement('canvas');
  const scale = maxWidth / src.width;
  c.width = Math.round(src.width * scale);
  c.height = Math.round(src.height * scale);
  const g = c.getContext('2d');
  g.fillStyle = '#0e1016';
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL(mime, quality);
}

function exportGLB() {
  if (!current) { send({ type: 'error', message: 'There is no model to export.' }); return; }
  new GLTFExporter().parse(
    current,
    (result) => {
      const buf = result instanceof ArrayBuffer ? result : new TextEncoder().encode(JSON.stringify(result)).buffer;
      send({ type: 'glb', buffer: buf }, [buf]);
    },
    (err) => send({ type: 'error', message: 'GLB export failed: ' + formatError(err) }),
    { binary: true, onlyVisible: true }
  );
}

/* ── message protocol with the parent ─────────────── */
addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  try {
    switch (msg.type) {
      case 'run':
        run(String(msg.code || ''));
        break;
      case 'clear':
        clearModel(); hud.textContent = '';
        break;
      case 'options':
        if ('autoRotate' in msg) autoRotate = !!msg.autoRotate;
        if ('grid' in msg) grid.visible = !!msg.grid;
        if ('wireframe' in msg) { wireframe = !!msg.wireframe; applyWireframe(wireframe); }
        break;
      case 'shot':
        send({ type: 'shot', dataUrl: snapshot({ mime: 'image/png' }) });
        break;
      case 'thumb':
        send({ type: 'thumb', dataUrl: snapshot({ maxWidth: 320, mime: 'image/jpeg', quality: 0.72 }) });
        break;
      case 'export':
        exportGLB();
        break;
    }
  } catch (err) {
    send({ type: 'error', message: formatError(err) });
  }
});

send({ type: 'ready' });
</script>
</body>
</html>
